<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a231e" />
      <stop offset="70%" stop-color="#191512" />
      <stop offset="100%" stop-color="#0f0c0a" />
    </radialGradient>
    
    <!-- Metallic Brass Gradient -->
    <linearGradient id="brass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d68b" />
      <stop offset="30%" stop-color="#d4a34b" />
      <stop offset="60%" stop-color="#b6832e" />
      <stop offset="100%" stop-color="#805615" />
    </linearGradient>

    <!-- Amber Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb84d" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#ff8c00" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0" />
    </radialGradient>

    <!-- Inset Bevel Shadow -->
    <filter id="chassisShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Rounded Chassis -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="url(#bg)" stroke="#3d332a" stroke-width="6" filter="url(#chassisShadow)" />

  <!-- Inner Recessed Plate -->
  <rect x="56" y="56" width="400" height="400" rx="72" fill="#14110e" stroke="#251f19" stroke-width="4" />

  <!-- Amber Ambient Glow behind Cassette -->
  <circle cx="256" cy="256" r="160" fill="url(#amberGlow)" />

  <!-- Cassette Body Outline -->
  <rect x="96" y="140" width="320" height="200" rx="20" fill="#201a15" stroke="url(#brass)" stroke-width="5" />
  
  <!-- Cassette Label Area -->
  <path d="M 120 160 L 392 160 L 372 230 L 140 230 Z" fill="#2d241d" stroke="#4a3c2e" stroke-width="2" />
  <text x="256" y="195" font-family="monospace, sans-serif" font-weight="900" font-size="22" fill="#f5d68b" text-anchor="middle" letter-spacing="4">SYMPHONY R2</text>
  <text x="256" y="218" font-family="monospace, sans-serif" font-weight="600" font-size="12" fill="#d4a34b" text-anchor="middle" letter-spacing="2">OFFLINE HI-FI DECK</text>

  <!-- Cassette Tape Window -->
  <rect x="156" y="245" width="200" height="75" rx="14" fill="#0c0a08" stroke="#3d332a" stroke-width="3" />

  <!-- Left Reel Spool -->
  <circle cx="206" cy="282" r="24" fill="#1b1713" stroke="url(#brass)" stroke-width="4" />
  <circle cx="206" cy="282" r="10" fill="#f5d68b" />
  <circle cx="206" cy="264" r="3" fill="#ffffff" />
  <circle cx="206" cy="300" r="3" fill="#ffffff" />
  <circle cx="188" cy="282" r="3" fill="#ffffff" />
  <circle cx="224" cy="282" r="3" fill="#ffffff" />

  <!-- Right Reel Spool -->
  <circle cx="306" cy="282" r="24" fill="#1b1713" stroke="url(#brass)" stroke-width="4" />
  <circle cx="306" cy="282" r="10" fill="#f5d68b" />
  <circle cx="306" cy="264" r="3" fill="#ffffff" />
  <circle cx="306" cy="300" r="3" fill="#ffffff" />
  <circle cx="288" cy="282" r="3" fill="#ffffff" />
  <circle cx="324" cy="282" r="3" fill="#ffffff" />

  <!-- Tape Strip Bridge -->
  <line x1="230" y1="282" x2="282" y2="282" stroke="#8c5828" stroke-width="6" />

  <!-- Stereo Equalizer Wave at Bottom -->
  <g fill="url(#brass)">
    <rect x="130" y="375" width="14" height="25" rx="4" />
    <rect x="155" y="360" width="14" height="40" rx="4" />
    <rect x="180" y="350" width="14" height="50" rx="4" />
    <rect x="205" y="365" width="14" height="35" rx="4" />
    <rect x="230" y="345" width="14" height="55" rx="4" />
    <rect x="255" y="340" width="14" height="60" rx="4" fill="#ffb84d" />
    <rect x="280" y="350" width="14" height="50" rx="4" />
    <rect x="305" y="362" width="14" height="38" rx="4" />
    <rect x="330" y="355" width="14" height="45" rx="4" />
    <rect x="355" y="368" width="14" height="32" rx="4" />
    <rect x="380" y="380" width="14" height="20" rx="4" />
  </g>
</svg>
